name: seizure_compass
description: "Seizure Compass — Navigate. Differentiate. Localize."
publish_to: 'none'
version: 2.0.0+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  provider: ^6.1.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: SourceSans
      fonts:
        - asset: assets/fonts/SourceSans3-Regular.ttf
          weight: 400
        - asset: assets/fonts/SourceSans3-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SourceSans3-Bold.ttf
          weight: 700
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader-Medium.ttf
          weight: 500
        - asset: assets/fonts/Newsreader-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Newsreader-SemiBoldItalic.ttf
          weight: 600
          style: italic
