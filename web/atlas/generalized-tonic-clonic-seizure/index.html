  <noscript>
    <h1>Seizure Compass</h1>
    <p>Free decision support for clinicians and trainees reasoning through a witnessed paroxysmal event. It weighs witnessed features toward an epileptic seizure, psychogenic non-epileptic seizure (PNES), syncope or another mimic, shows which findings pushed the result each way, and suggests a probable lobe of onset when a focal epileptic mechanism is likely. Weights come from published studies (with an evidence grade for each) and the validated Calgary Syncope–Seizure Score is included; the combined model is not yet validated on patients and is not a diagnostic device. Part of <a href="https://thetract.org/">The Tract</a>. Created by <a href="https://thetract.org/about/" rel="author">Dr Mohamed Najm Aldeen Alameen</a> (ORCID <a href="https://orcid.org/0009-0001-5506-2757" rel="me">0009-0001-5506-2757</a>).</p>
    <p>Worked examples: <a href="/example/convulsive-seizure">convulsion from sleep</a>, <a href="/example/pnes">prolonged event with eyes closed</a>, <a href="/example/convulsive-syncope">faint with jerks</a>, <a href="/example/cardiac-red-flag">collapse while running</a>.</p>
    <p>Seizure Compass needs JavaScript to run.</p>
  </noscript>
  <div id="splash">
    <div class="word">Seizure <i>Compass</i></div>
    <div class="load"><div class="bar"><b id="sp-bar"></b></div><div class="sub"><span id="sp-stage">Downloading the engine…</span><span id="sp-pct"></span></div></div>
    <div class="card" id="sp-card">
      <div class="kick"><span>While you wait · seizure or mimic?</span><span id="sp-score"></span></div>
      <div class="q" id="sp-q"></div>
      <div class="opts"><button type="button" data-a="E">Epileptic</button><button type="button" data-a="M">Mimic</button></div>
      <div class="why" id="sp-why"></div>
    </div>
    <button type="button" class="go" id="sp-go">Open the Compass →</button>
    <div class="fine">Teaching items, not a diagnosis. The first visit downloads the app once; later visits open faster.</div>
  </div>

    var Q = [
      ['Eyes kept firmly shut throughout the event; they resist being opened.', 'M', 'Eye closure during the event strongly favours a functional (psychogenic) seizure. In epileptic seizures the eyes are usually open.'],
      ['Bitten tongue, on the side, after a convulsion from sleep.', 'E', 'A lateral tongue bite is one of the most specific bedside signs of a generalised tonic–clonic seizure.'],
      ['Stood up in a hot room, went pale, fell, a few jerks for under 15 seconds, then alert at once.', 'M', 'Convulsive syncope. Brief irregular jerks are common in fainting, and recovery is quick with little confusion.'],
      ['Crying during the episode.', 'M', 'Ictal crying is a well-described sign of functional (psychogenic) seizures.'],
      ['A rising feeling in the stomach, then lip-smacking and fumbling with the hands, with no memory of it.', 'E', 'An epigastric aura followed by oral and manual automatisms is a classic temporal-lobe seizure.'],
      ['Several brief, stereotyped episodes a night from sleep, with thrashing and pelvic thrusting.', 'E', 'Trap: pelvic thrusting also occurs in frontal-lobe (hypermotor) seizures. Brief, stereotyped and clustered from sleep points to epilepsy.'],
      ['Side-to-side head shaking that waxes and wanes for ten minutes.', 'M', 'Long, fluctuating events with side-to-side head movements favour functional seizures.'],
      ['Collapsed while running; brief jerking; known family history of sudden death.', 'M', 'Mimic, and a red flag: exertional collapse needs an ECG and a cardiac work-up before anyone says epilepsy.'],
      ['Both arms and legs shook for two minutes, yet the person recalls every moment.', 'M', 'Bilateral convulsive movements with preserved awareness and recall argue for a functional seizure (frontal seizures are the rare exception).'],
      ['Head forced to one side, then generalised stiffening and jerking, then confused for 20 minutes.', 'E', 'Forced head version followed by a generalised convulsion and prolonged confusion is a focal-to-bilateral tonic–clonic seizure.'],
      ['Grey and limp after a blood test, a few twitches, fully back within seconds.', 'M', 'Reflex (vasovagal) syncope, triggered by pain or the sight of blood.'],
      ['Wakes from a nap, stares, and does not respond for a minute, then is drowsy for half an hour.', 'E', 'Unresponsiveness with prolonged post-event drowsiness favours a focal impaired-awareness seizure over a faint.']
    ];
    for (var i = Q.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = Q[i]; Q[i] = Q[j]; Q[j] = t; }
    var $ = function (id) { return document.getElementById(id); };
    var splash = $('splash'), n = 0, right = 0, done = 0, locked = false, played = false, ready = false;
    function show() {

      $('sp-q').textContent = q[0]; $('sp-why').innerHTML = '';
      Array.prototype.forEach.call(splash.querySelectorAll('.opts button'), function (b) { b.className = ''; });
    }

      var b = e.target.closest('button'); if (!b || locked) return;

      $('sp-why').innerHTML = '<b>' + (ok ? 'Right. ' : 'Not quite. ') + '</b>' + q[2];

    $('sp-go').addEventListener('click', close);
    window.addEventListener('flutter-first-frame', function () {
      ready = true; clearInterval(tick); set(100, 'Ready');
      // if they are mid-question, let them finish and open when they choose
      if (played) { splash.classList.add('ready'); setTimeout(close, 15000); } else close();
    });
  })();
