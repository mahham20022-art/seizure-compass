  <noscript>
    <h1>Seizure Compass</h1>
    <p>Free decision support for clinicians and trainees reasoning through a witnessed paroxysmal event. It weighs witnessed features toward an epileptic seizure, psychogenic non-epileptic seizure (PNES), syncope or another mimic, shows which findings pushed the result each way, and suggests a probable lobe of onset when a focal epileptic mechanism is likely. Weights come from published studies (with an evidence grade for each) and the validated Calgary Syncope–Seizure Score is included; the combined model is not yet validated on patients and is not a diagnostic device. Part of <a href="https://thetract.org/">The Tract</a>. Created by <a href="https://thetract.org/about/" rel="author">Dr Mohamed Najm Aldeen Alameen</a> (ORCID <a href="https://orcid.org/0009-0001-5506-2757" rel="me">0009-0001-5506-2757</a>).</p>
    <p>Worked examples: <a href="/example/convulsive-seizure">convulsion from sleep</a>, <a href="/example/pnes">prolonged event with eyes closed</a>, <a href="/example/convulsive-syncope">faint with jerks</a>, <a href="/example/cardiac-red-flag">collapse while running</a>.</p>
    <p>Seizure Compass needs JavaScript to run.</p>
  </noscript>
